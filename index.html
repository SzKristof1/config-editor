<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>INI Config Editor</title>
</head>
<body>
    <div class="container">
        <h1>Edit Your INI File</h1>
        <input type="file" id="iniFile" accept=".ini">
        <input type="text" id="steamLink" placeholder="Enter Steam Profile Link">
        <button id="submit">Edit INI</button>
        <a id="downloadLink" style="display:none;">Download Edited INI</a>
    </div>
    <script src="app.js"></script>
</body>
</html>
